[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "majec"
version = "0.2.0"
description = "Momentum-Accelerated Junction-Enhanced Counting Ecosystem"
authors = ["Ari J. Firestone <arijfire@alumni.stanford.edu>"]
license = "Apache-2.0"
readme = "README.md"
packages = [{include = "majec", from = "src"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Intended Audience :: Science/Research",
]

# --- DEPENDENCY DEFINITIONS ---
# All dependencies, including optional ones, are defined here.
[tool.poetry.dependencies]
python = "^3.11"

# --- Core Dependencies ---
numpy = "^2.3"
pandas = "^2.3"
scipy = ">=1.16"   # truncated-normal effective lengths
pysam = ">=0.22"   # pure-Python EqC builder; always available, so a plain install works

# --- Optional Dependencies ---
# They are defined here but marked as "optional".
# They will only be installed if an "extra" group calls them.
polars = { version = ">=1.33", optional = true }
plotly = { version = ">=6.3", optional = true }
python-kaleido = { version = ">=1.0", optional = true }
pypdf2 = { version = ">=3.0", optional = true }
xlsxwriter = { version = ">=3.1", optional = true }
# Compiled EqC builder (Rust, prebuilt wheels): the same results as the pysam
# builder with a roughly 6x faster BAM scan. Optional, so a plain `pip install
# majec` never needs Rust; the pipeline falls back to pysam and logs which ran.
# On a platform with no wheel, `majec[rust]` tries to compile and needs a Rust
# toolchain.
majec-core = { version = ">=0.2.0", optional = true }

# --- OPTIONAL DEPENDENCY GROUPS ("EXTRAS") ---
# This section now contains ONLY the names of the packages.
# The versions are managed in the section above.
[tool.poetry.extras]
rust = ["majec-core"]
database = ["polars"]
viz = ["plotly", "python-kaleido", "pypdf2", "xlsxwriter"]
tools = []  # kept so `majec[tools]` still resolves; scipy is now a core dependency
full_analysis = ["polars", "plotly", "python-kaleido", "pypdf2", "xlsxwriter"]

# --- DEV DEPENDENCIES (not published to PyPI) ---
# A group, not an extra: extras are published in the wheel's metadata, so
# `pytest` as an extra puts a test-only dependency in front of every user.
[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"  # <9.0.3 is CVE-2025-71176 (tmpdir handling)

# --- SCRIPT ENTRY POINTS ---
[tool.poetry.scripts]
majec_run_pipeline = "majec.pipeline:main"
majec_precompute_annotations = "majec.preprocess:main"
majec_build_db = "majec.database:main"
majec_add_norm_factors = "majec.tools.normalization:main"
majec_prepare_deseq2 = "majec.analysis.deseq2:main"
majec_visualize = "majec.analysis.visualization:main"
majec_calc_frag_len = "majec.tools.fragment_lengths:main"
majec_calc_thresholds = "majec.tools.thresholds:main"

# --- TESTS ---
[tool.pytest.ini_options]
testpaths = ["tests"]
# The slow tier needs cluster-scale inputs and minutes of runtime, so a bare
# `pytest` skips it. Run it with `pytest -m slow -s`.
addopts = "-m 'not slow'"
markers = [
    "slow: needs multi-GB inputs and minutes of runtime (opt in with -m slow)",
]